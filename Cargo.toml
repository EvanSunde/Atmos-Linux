[package]
name = "atmos-render"
version = "0.1.0"
edition = "2021"
description = "Real-time Dolby Atmos decoder (E-AC-3 + JOC, TrueHD) rendering to 7.1.4 PCM"
license-file = "LICENSE.md"

[dependencies]
truehd = "0.7.2"

[profile.release]
opt-level = 3
codegen-units = 16
debug = false

# Compiling the truehd crate fully optimised needs a lot of RAM (> 6 GB). If the build is
# killed for lack of memory, reduce MIR inlining for that crate only (about 5 GB, same speed):
#   RUSTC_BOOTSTRAP=1 RUSTC_WRAPPER=tools/rustc-truehd-wrapper.sh cargo build --release
# or, as a last resort, uncomment this (TrueHD then decodes ~10x slower):
# [profile.release.package.truehd]
# opt-level = 0
