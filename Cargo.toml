[package]
name = "atmos-render"
version = "0.1.0"
edition = "2021"
description = "Real-time Dolby Atmos decoder (E-AC-3 + JOC, TrueHD) rendering to 7.1.4 PCM"
license-file = "LICENSE.md"

[dependencies]
truehd = "0.7.2"

[profile.release]
opt-level = 3
codegen-units = 16
debug = false

# The truehd crate needs >6 GB of RAM to compile optimised; on smaller machines keep this.
[profile.release.package.truehd]
opt-level = 0
